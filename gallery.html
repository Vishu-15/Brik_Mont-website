<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Mont</title>
    <link rel="icon" href="./images/logo.jpg" type="image/icon type">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baskervville+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar - Loaded dynamically from components/navbar.html -->
  <div id="navbar"></div>

      <div class="jumbo jumbotron-fluid ">
          <img src="./images/gallery-jumbo-new.jpg" class="img-fluid" alt="...">
          <div class="jumbo-logo">
              <p style="color:rgb(255, 255, 255)">GALLERY</p>
          </div>
        </div>

      <section>
        <div class="gallery-container">
          <!-- Images Section -->
          <div class="gallery-content">
            <div class="gallery-header">
              <h2 class="gallery-title">Gallery Showcase</h2>
              <p class="gallery-subtitle">Explore our latest products and facilities</p>
            </div>

            <!-- Main Carousel -->
            <div class="carousel-wrapper">
              <div class="main-carousel">
                <div class="carousel-inner" id="carousel-inner">
                  <!-- Carousel slides will be generated dynamically via JavaScript -->
                </div>

                <!-- Navigation Controls -->
                <button class="carousel-nav prev"><i class="fas fa-chevron-left"></i></button>
                <button class="carousel-nav next"><i class="fas fa-chevron-right"></i></button>
                
                <!-- Image Counter -->
                <div class="image-counter">
                  <span id="current-image">1</span> / <span id="total-images">30</span>
                </div>

                <!-- Zoom Indicator -->
                <div class="zoom-indicator">
                  <i class="fas fa-expand-alt"></i>
                  <span>Click to zoom</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Videos Section -->
          <div class="videos-section">
            <div class="section-header">
              <h2 class="section-title">Video Gallery</h2>
              <p class="section-subtitle">Watch our latest videos</p>
            </div>
            <div class="videos-container">
              <div class="video-card">
                <iframe src="https://www.youtube.com/embed/lFKqQWwbWA4?si=td4OxKtZx68ZRmPi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div id="footer"></div>
</body>
<!-- Navbar & Footer - Loaded dynamically from components -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="./include.js"></script>
<script src="./script.js"></script>
<script>
    // Gallery Configuration
    const GALLERY_CONFIG = {
        totalImages: 30,
        imagePath: './images/gallery-img',
        imageFormat: '.jpeg'
    };

    let currentImage = 1;

    // Initialize carousel slides dynamically
    function initializeCarousel() {
        const carouselInner = document.getElementById('carousel-inner');
        
        for (let i = 1; i <= GALLERY_CONFIG.totalImages; i++) {
            const slide = document.createElement('div');
            slide.className = `carousel-slide ${i === 1 ? 'active' : ''}`;
            slide.id = `img${i}`;
            
            const img = document.createElement('img');
            img.src = `${GALLERY_CONFIG.imagePath}${i}${GALLERY_CONFIG.imageFormat}`;
            img.alt = `Gallery Image ${i}`;
            
            slide.appendChild(img);
            carouselInner.appendChild(slide);
        }
    }

    // Update image counter
    function updateCounter() {
        document.getElementById('current-image').textContent = currentImage;
        document.getElementById('total-images').textContent = GALLERY_CONFIG.totalImages;
    }

    // Show image by number
    function showImage(imageNum) {
        document.querySelector(`.carousel-slide.active`)?.classList.remove('active');
        document.querySelector(`#img${imageNum}`).classList.add('active');
        updateCounter();
    }

    // Next image
    function nextImage() {
        currentImage = currentImage < GALLERY_CONFIG.totalImages ? currentImage + 1 : 1;
        showImage(currentImage);
    }

    // Previous image
    function prevImage() {
        currentImage = currentImage > 1 ? currentImage - 1 : GALLERY_CONFIG.totalImages;
        showImage(currentImage);
    }

    // Navigation button click handlers
    document.querySelector('.carousel-nav.next').addEventListener('click', nextImage);
    document.querySelector('.carousel-nav.prev').addEventListener('click', prevImage);

    // Fullscreen on zoom button click
    document.querySelector('.zoom-indicator').addEventListener('click', function() {
        const activeImage = document.querySelector('.carousel-slide.active img');
        if (!activeImage) return;

        if (!document.fullscreenElement) {
            // Enter fullscreen
            if (activeImage.requestFullscreen) {
                activeImage.requestFullscreen();
            } else if (activeImage.mozRequestFullScreen) {
                activeImage.mozRequestFullScreen();
            } else if (activeImage.webkitRequestFullscreen) {
                activeImage.webkitRequestFullscreen();
            } else if (activeImage.msRequestFullscreen) {
                activeImage.msRequestFullscreen();
            }
        } else {
            // Exit fullscreen
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }
    });

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
        initializeCarousel();
        updateCounter();
    });
</script>
</html>
