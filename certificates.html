<script>
  fetch('certificates.json')
  .then(res => res.json())
  .then(data => {
    const container = document.querySelector('.files');
    container.innerHTML = '';

    data.forEach(cert => {
      container.innerHTML += `
        <div class="file">
          <a href="${cert.file}" target="_blank">
            <img src="./images/pdf-icon.webp">
            <p class="midsize">${cert.name}</p>
          </a>
        </div>
      `;
    });
  });
</script>
