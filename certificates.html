<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
        const modalElement = document.getElementById('pdfPreviewModal');
        const pdfModal = new bootstrap.Modal(modalElement);
        const iframe = document.getElementById('pdfPreviewFrame');
        const previewTitle = document.getElementById('pdfPreviewModalLabel');
        const openBtn = document.getElementById('pdfPreviewOpenBtn');
        const downloadBtn = document.getElementById('pdfDownloadBtn');
        const printBtn = document.getElementById('pdfPrintBtn');
        const container = document.querySelector('.files');

        fetch('certificates.json')
          .then(res => res.json())
          .then(data => {
            container.innerHTML = '';

            data.forEach(cert => {
              const fileCard = document.createElement('div');
              fileCard.className = 'file';
              fileCard.tabIndex = 0;
              fileCard.setAttribute('role', 'button');
              fileCard.setAttribute('aria-label', `Preview ${cert.name}`);
              fileCard.dataset.file = cert.file;
              fileCard.dataset.name = cert.name.replace(/<br\s*\/?>/gi, ' ');

              fileCard.innerHTML = `
                <img src="./images/pdf-icon.webp" alt="PDF icon">
                <p class="midsize">${cert.name}</p>
              `;

              fileCard.addEventListener('click', () => openPreview(cert.file, cert.name));
              fileCard.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                  event.preventDefault();
                  openPreview(cert.file, cert.name);
                }
              });

              container.appendChild(fileCard);
            });
          })
          .catch(error => {
            container.innerHTML = '<p class="text-danger">Unable to load certificates. Please try again later.</p>';
            console.error('Error loading certificates:', error);
          });

        function openPreview(fileUrl, fileName) {
          previewTitle.textContent = fileName.replace(/<br\s*\/?>/gi, ' ');
          iframe.src = fileUrl;
          openBtn.href = fileUrl;
          downloadBtn.href = fileUrl;
          downloadBtn.setAttribute('download', `${fileName.replace(/<br\s*\/?>/gi, ' ').trim()}.pdf`);
          pdfModal.show();
        }

        printBtn.addEventListener('click', () => {
          if (iframe.contentWindow) {
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
          }
        });
  });
</script>
