<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
        const modalElement = document.getElementById('pdfPreviewModal');
        const pdfModal = new bootstrap.Modal(modalElement);
        const iframe = document.getElementById('pdfPreviewFrame');
        const previewTitle = document.getElementById('pdfPreviewModalLabel');
        const container = document.querySelector('.files');

        if (!window.pdfjsLib) {
          console.error(
            'PDF.js could not be loaded. Check that ./js/pdfjs/pdf.min.js exists.'
          );
        }

        fetch('certificates.json')
          .then(res => res.json())
          .then(data => {
            container.innerHTML = '';

            data.forEach(cert => {
              const fileCard = document.createElement('div');
              fileCard.className = 'file';
              fileCard.tabIndex = 0;
              fileCard.setAttribute('role', 'button');
              fileCard.setAttribute('aria-label', `Preview ${cert.name}`);
              fileCard.dataset.file = cert.file;
              fileCard.dataset.name = cert.name.replace(/<br\s*\/?>/gi, ' ');

              fileCard.innerHTML = `
                <div class="certificate-preview" aria-hidden="true">
                  <div class="certificate-preview-loading">
                    <i class="fa-regular fa-file-pdf"></i>
                    <span>Loading preview…</span>
                  </div>
                  <canvas class="certificate-preview-canvas"></canvas>
                </div>
                <div class="certificate-card-info">
                  <p class="midsize">${cert.name}</p>
                  <span class="certificate-view-label">
                    View Certificate <i class="fa-solid fa-arrow-right"></i>
                  </span>
                </div>
              `;

              container.appendChild(fileCard);
              renderCertificateThumbnail(
                cert.file,
                fileCard.querySelector('.certificate-preview'),
                fileCard.querySelector('.certificate-preview-canvas')
              );

              fileCard.addEventListener('click', () => openPreview(cert.file, cert.name));
              fileCard.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                  event.preventDefault();
                  openPreview(cert.file, cert.name);
                }
              });
            });
          })
          .catch(error => {
            container.innerHTML = '<p class="text-danger">Unable to load certificates. Please try again later.</p>';
            console.error('Error loading certificates:', error);
          });

        async function renderCertificateThumbnail(fileUrl, previewContainer, canvas) {
          const loading = previewContainer.querySelector('.certificate-preview-loading');

          try {
            if (!window.pdfjsLib) {
              throw new Error('PDF.js failed to load.');
            }

            pdfjsLib.GlobalWorkerOptions.workerSrc = './js/pdfjs/pdf.worker.js';

            const pdf = await pdfjsLib.getDocument(fileUrl).promise;
            const page = await pdf.getPage(1);

            const containerWidth = Math.max(previewContainer.clientWidth - 28, 160);
            const containerHeight = Math.max(previewContainer.clientHeight - 28, 180);
            const baseViewport = page.getViewport({ scale: 1 });

            const widthScale = containerWidth / baseViewport.width;
            const heightScale = containerHeight / baseViewport.height;

            // Fit the full first page inside the preview while keeping its aspect ratio.
            const scale = Math.min(widthScale, heightScale, 1.5);
            const viewport = page.getViewport({ scale });

            const outputScale = window.devicePixelRatio || 1;

            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;

            const context = canvas.getContext('2d', { alpha: false });

            await page.render({
              canvasContext: context,
              viewport,
              transform: outputScale !== 1
                ? [outputScale, 0, 0, outputScale, 0, 0]
                : null
            }).promise;

            canvas.classList.add('is-rendered');
            loading.remove();
          } catch (error) {
            console.warn(`Could not render PDF thumbnail: ${fileUrl}`, error);
            loading.innerHTML = `
              <i class="fa-regular fa-file-pdf"></i>
              <span>PDF Certificate</span>
            `;
            previewContainer.classList.add('preview-fallback');
          }
        }

        function openPreview(fileUrl, fileName) {
          previewTitle.textContent = fileName.replace(/<br\s*\/?>/gi, ' ');
          iframe.src = fileUrl;
          // openBtn.href = fileUrl;
          // downloadBtn.href = fileUrl;
          // downloadBtn.setAttribute('download', `${fileName.replace(/<br\s*\/?>/gi, ' ').trim()}.pdf`);
          pdfModal.show();
        }

        modalElement.addEventListener('hidden.bs.modal', () => {
          iframe.src = '';
        });
  });
</script>
